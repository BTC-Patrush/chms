name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: Audit, format, lint, typecheck, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  database:
    name: PostgreSQL 18 compatibility and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start a disposable PostgreSQL 18 cluster
        run: |
          password_file="$RUNNER_TEMP/pg-admin-password"
          (umask 022 && openssl rand -hex 24 > "$password_file")
          echo "CHMS_PG_ADMIN_PASSWORD_FILE=$password_file" >> "$GITHUB_ENV"
          CHMS_PG_ADMIN_PASSWORD_FILE="$password_file" docker compose up --detach --wait
      - run: npm run test:db
      - name: Remove the disposable cluster
        if: always()
        run: docker compose down --volumes
